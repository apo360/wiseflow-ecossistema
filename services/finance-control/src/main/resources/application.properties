# finance-control application.properties

# ---- Servidor ----
server.port=8080

# ---- MySQL (Base de Dados do Finance) ----
spring.datasource.url=jdbc:mysql://localhost:3306/wiseflow_finance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update   # ou 'validate' em produção
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Redis (para revogação de tokens) ----
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=

